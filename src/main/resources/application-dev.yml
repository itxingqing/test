# 数据源配置
spring:
    datasource:
        type: com.alibaba.druid.pool.DruidDataSource
        driverClassName: com.mysql.cj.jdbc.Driver
        druid:
            # 主库数据源
            master:
                url: jdbc:mysql://10.1.8.57:3306/register?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
                username: license
                password: lic001
            # 从库数据源
            slave:
                # 从数据源开关/默认关闭
                enabled: false
                url: 
                username: 
                password: 
            # 初始连接数
            initialSize: 5
            # 最小连接池数量
            minIdle: 10
            # 最大连接池数量
            maxActive: 20
            # 配置获取连接等待超时的时间
            maxWait: 60000
            # 配置连接超时时间
            connectTimeout: 30000
            # 配置网络超时时间
            socketTimeout: 60000
            # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
            timeBetweenEvictionRunsMillis: 60000
            # 配置一个连接在池中最小生存的时间，单位是毫秒
            minEvictableIdleTimeMillis: 300000
            # 配置一个连接在池中最大生存的时间，单位是毫秒
            maxEvictableIdleTimeMillis: 900000
            # 配置检测连接是否有效
            validationQuery: SELECT 1 FROM DUAL
            testWhileIdle: true
            testOnBorrow: false
            testOnReturn: false
            webStatFilter: 
                enabled: true
            statViewServlet:
                enabled: true
                # 设置白名单，不填则允许所有访问
                allow:
                url-pattern: /druid/*
                # 控制台管理用户名和密码
                login-username: ruoyi
                login-password: 123456
            filter:
                stat:
                    enabled: true
                    # 慢SQL记录
                    log-slow-sql: true
                    slow-sql-millis: 1000
                    merge-sql: true
                wall:
                    config:
                        multi-statement-allow: true

# 许可证服务配置
license:
    server:
        # ==================== RSA私钥配置 ====================
        # 用途：服务器签名许可证令牌
        # 格式：Base64编码的PKCS8格式
        # 生成：运行 KeyGenerator 工具生成（仅首次部署时）
        # 长度：约1700个字符
        # 安全：绝密，仅存在于服务器端，不要泄露
        #
        # 示例值已失效，请使用KeyGenerator生成真实密钥
        private-key: ${LICENSE_SERVER_PRIVATE_KEY:}

        # ==================== HKDF盐值配置 ====================
        # 用途：增强密钥派生的安全性，防止彩虹表攻击
        # 格式：Base64编码，64字节（88个Base64字符）
        # 生成：运行 KeyGenerator 工具生成（仅首次部署时）
        # 要求：必须是64字节，否则启动失败
        # 安全：绝密，仅存在于服务器端，不要泄露
        #
        # 示例值已失效，请使用KeyGenerator生成真实盐值
        hkdf-salt: ${LICENSE_SERVER_SALT:TouL0sj2bgZTrQkYte6RPbS2rY+nwvOI3mbBXCF3BE8O9OuIf5GZ+9NM676HsRsXCvl9VvHevvtpQ4JgkfImmg==}

        # ==================== 使用说明 ====================
        # 1. 首次部署时运行：mvn exec:java -Dexec.mainClass="com.yourcompany.license.util.KeyGenerator"
        # 2. 复制输出的private-key和hkdf-salt到此文件
        # 3. 生产环境推荐使用环境变量：
        #    export LICENSE_SERVER_PRIVATE_KEY="真实私钥"
        #    export LICENSE_SERVER_SALT="真实盐值"
        # 4. 备份密钥到安全位置（密码管理器或加密存储）
        # 5. 不要将包含真实密钥的配置文件提交到Git